CONFIG_MPU6050_TRIGGER_NONE=y
CONFIG_MPU6050=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PWM=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BMI323=y
CONFIG_BMI323_TRIGGER=n
CONFIG_BMP180=y

# Enable the serial driver framework
CONFIG_SERIAL=y

# Enable console printing if you linked uart0 to zephyr,console
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=2

